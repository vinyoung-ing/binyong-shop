<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffced8" />
  <title>서비스 · 비뇽</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="storefront">
  <header id="site-header"></header>

  <section class="page-hero blob-bg">
    <div class="page-hero-inner">
      <p class="eyebrow">PRICE LIST</p>
      <h1>서비스 가격표</h1>
      <p>원하는 항목의 수량을 정해 담아두고, 오른쪽(모바일은 아래) 선택한 항목에서 한 번에 주문하세요.</p>
    </div>
  </section>

  <main class="page-container">
    <div class="category-tabs" id="category-tabs">
      <p class="muted">카테고리 불러오는 중...</p>
    </div>
    <p class="category-intro" id="category-intro"></p>

    <div class="services-layout">
      <div id="price-groups">
        <p class="muted">가격표를 불러오는 중...</p>
      </div>

      <aside class="selected-panel">
        <h3>선택한 항목</h3>
        <div id="selected-list">
          <p class="empty">아직 담은 항목이 없습니다.</p>
        </div>
        <div class="selected-total" id="selected-total" hidden>
          <span>예상 합계</span>
          <span id="selected-total-amount">0</span>
        </div>
        <a href="order.html" class="btn-primary btn-block mt-24">빠른주문 하러가기</a>
      </aside>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="js/services.js"></script>
</body>
</html>
