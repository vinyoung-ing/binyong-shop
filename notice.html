<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffced8" />
  <title>공지사항 · 비뇽</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="storefront">
  <header id="site-header"></header>

  <section class="page-hero blob-bg">
    <div class="page-hero-inner">
      <p class="eyebrow">NOTICE</p>
      <h1>공지사항</h1>
      <p>작업 일정, 가격 변경, 이벤트 소식을 알려드려요.</p>
    </div>
  </section>

  <main class="page-container static-content">
    <div id="notice-list" class="notice-list">
      <p class="muted">불러오는 중...</p>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { renderHeader, renderFooter, initScrollReveal, escapeHtml } from "./js/common.js";
    import { db, collection, getDocs, query, orderBy } from "./js/firebase-init.js";

    renderHeader("notice");
    renderFooter();

    const NEW_DAYS = 7;

    async function renderNotices() {
      const listEl = document.getElementById("notice-list");
      try {
        const q = query(collection(db, "notices"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        if (snap.empty) {
          listEl.innerHTML = `<p class="muted">등록된 공지사항이 없습니다.</p>`;
          return;
        }

        // 고정 공지를 맨 위로 (정렬은 클라이언트에서 해서 별도 색인이 필요 없게 함)
        const notices = snap.docs
          .map((d) => ({ id: d.id, ...d.data() }))
          .sort((a, b) => Number(!!b.pinned) - Number(!!a.pinned));

        listEl.innerHTML = notices
          .map((n, i) => {
            const created = n.createdAt?.toDate ? n.createdAt.toDate() : null;
            const date = created ? created.toLocaleDateString("ko-KR") : "";
            const isNew = created && Date.now() - created.getTime() < NEW_DAYS * 86400000;
            return `
              <details class="notice-item" data-reveal ${i === 0 ? "open" : ""}>
                <summary>
                  <span class="notice-title">
                    ${n.pinned ? `<span class="badge pinned">고정</span>` : ""}
                    ${isNew ? `<span class="badge new">NEW</span>` : ""}
                    ${escapeHtml(n.title || "(제목 없음)")}
                  </span>
                  <time>${date}</time>
                </summary>
                <p>${escapeHtml(n.body || "")}</p>
              </details>
            `;
          })
          .join("");
        initScrollReveal();
      } catch (e) {
        listEl.innerHTML = `<p class="muted">공지사항을 불러오지 못했습니다.</p>`;
        console.error(e);
      }
    }

    renderNotices();
  </script>
</body>
</html>
