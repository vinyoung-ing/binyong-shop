<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 로그인 · 비뇽</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-box">
      <h1>비뇽 관리자</h1>
      <form id="login-form">
        <label for="email">이메일</label>
        <input type="email" id="email" required autocomplete="username" />
        <label for="password">비밀번호</label>
        <input type="password" id="password" required autocomplete="current-password" />
        <button type="submit" class="btn-primary mt-24" style="width:100%;">로그인</button>
        <p class="login-error" id="login-error" hidden></p>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, signInWithEmailAndPassword, onAuthStateChanged } from "../js/firebase-init.js";

    onAuthStateChanged(auth, (user) => {
      if (user) location.href = "dashboard.html";
    });

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("login-error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      try {
        await signInWithEmailAndPassword(auth, form.email.value, form.password.value);
        location.href = "dashboard.html";
      } catch (err) {
        errorEl.textContent = "로그인에 실패했습니다. 이메일/비밀번호를 확인해주세요.";
        errorEl.hidden = false;
      }
    });
  </script>
</body>
</html>
