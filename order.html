<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>빠른주문 · 비뇽</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="storefront">
  <header id="site-header"></header>

  <main class="page-container order-section">
    <h1>빠른주문</h1>
    <p class="muted">담은 항목을 확인한 뒤 주문하기를 누르면, 목록이 복사되고 카카오톡 채널이 열립니다. 채팅창에 붙여넣기(Ctrl+V)만 해주세요.</p>

    <div class="order-cart-list" id="order-cart-list"></div>

    <div class="order-actions">
      <button type="button" class="btn-primary" id="submit-btn">카카오톡으로 주문하기</button>
    </div>

    <div id="result-box"></div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="js/order.js"></script>

</html>
