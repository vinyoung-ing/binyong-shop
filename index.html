<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비뇽 | BINYONG</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="storefront">
  <header id="site-header"></header>

  <main>
    <div id="banner-carousel" class="banner-carousel" hidden></div>

    <section class="hero">
      <h1 id="hero-title">게임은 즐기고, 대리는 비뇽에게.</h1>
      <p>카테고리별 가격표를 보고 원하는 항목을 담아, 빠른주문으로 바로 신청하세요.</p>
      <a href="services.html" class="btn-primary" id="hero-cta">서비스 보러가기</a>
    </section>

    <section class="page-container">
      <h2 style="margin-top:40px;">서비스 카테고리</h2>
      <div id="category-grid" class="category-grid">
        <p class="muted">불러오는 중...</p>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { renderHeader, renderFooter, initScrollReveal } from "./js/common.js";
    import { listCategories } from "./js/catalog.js";
    import { renderBannerCarousel } from "./js/banner-carousel.js";
    import { splitTextReveal, initMagnetic, initTiltAll } from "./js/motion.js";

    renderHeader("home");
    renderFooter();
    renderBannerCarousel();

    splitTextReveal(document.getElementById("hero-title"));
    initMagnetic(document.getElementById("hero-cta"));

    async function renderCategories() {
      const grid = document.getElementById("category-grid");
      try {
        const categories = await listCategories();
        if (categories.length === 0) {
          grid.innerHTML = `<p class="muted">아직 등록된 카테고리가 없습니다. 관리자 페이지에서 카테고리를 추가해주세요.</p>`;
          return;
        }
        grid.innerHTML = categories
          .map((c) => {
            const isActive = c.status === "active";
            return `
              <div class="category-card ${isActive ? "" : "disabled"}" data-reveal>
                <span class="badge ${isActive ? "active" : "coming-soon"}">
                  ${isActive ? "운영중" : "오픈예정"}
                </span>
                <h3>${c.name}</h3>
                <p>${c.description || ""}</p>
                ${
                  isActive
                    ? `<a href="services.html?cat=${c.id}" class="btn-secondary">가격표 보기</a>`
                    : `<span class="btn-secondary" style="opacity:.5;">준비중</span>`
                }
              </div>
            `;
          })
          .join("");
        initScrollReveal();
        initTiltAll(grid, ".category-card:not(.disabled)");
      } catch (e) {
        grid.innerHTML = `<p class="muted">카테고리를 불러오지 못했습니다. Firebase 설정을 확인해주세요.</p>`;
        console.error(e);
      }
    }

    renderCategories();
  </script>
</body>
</html>
